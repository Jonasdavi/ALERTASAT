<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gráficos Dinâmicos de Dados Ambientais - Dark Mode</title>

</head>
<body>
